[package]
name = "wayland-mcp"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Capability-based Wayland computer-use MCP server (rmcp, stdio)"

[[bin]]
name = "wayland-mcp"
path = "src/main.rs"

[[bin]]
name = "gtk-fixture"
path = "src/bin/gtk_fixture.rs"
required-features = ["fixture"]

[features]
default = []
fixture = ["dep:gtk4"]

[dependencies]
rmcp = { version = "3.7", features = ["server", "client", "transport-io", "macros"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", features = ["png", "jpeg"] }
base64 = "0.22"
regex = "1"

# Linux-only: Wayland/PipeWire/D-Bus/uinput/OCR stack. Not built on other targets.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
gtk4 = { version = "0.9", optional = true }
libc = "0.2"
xkbcommon = "0.9"
ocrs = "0.13"
rten = "0.26"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop", "clipboard"] }
pipewire = "0.9"

[dev-dependencies]
serde_json = "1"
