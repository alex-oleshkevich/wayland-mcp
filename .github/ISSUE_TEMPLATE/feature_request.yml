name: Feature request
description: Suggest a tool, desktop or behaviour wayland-mcp does not support
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What are you trying to do?
      description: Describe the task, not just the missing tool.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behaviour
    validations:
      required: true
